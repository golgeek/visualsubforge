name: Retained Intel AAC diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  intel:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Build the Intel FFmpeg SDK
        run: |
          test "$(uname -m)" = x86_64
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          brew install xz nasm pkg-config
          if brew list --formula | grep -E '^ffmpeg(@.*)?$'; then exit 1; fi
          python -m pip install --only-binary=:all: -r tests/native/build-requirements.txt
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export PKG_CONFIG_PATH="" PKG_CONFIG_LIBDIR="$(brew --prefix xz)/lib/pkgconfig"
          sh scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffmpeg" 4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-unsigned-x86_64
          run-id: '44947623171'
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-acceptance-fixtures
          run-id: '44874189702'
          github-token: ${{ github.token }}
          path: fixtures
      - name: Compare the retained MP4s to the packaged Intel baseline
        run: |
          (cd baseline && shasum -a 256 -c SHA256SUMS)
          (cd fixtures && shasum -a 256 -c SHA256SUMS)
          ditto -x -k baseline/*.zip baseline/app
          mkdir results
          python tests/release/mp4-aac-parity.py decode --before baseline/app/VisualSubForge.app/Contents/MacOS --bundle "$RUNNER_TEMP/ffmpeg/sdk/bin" --fixtures fixtures --output results/mp4-aac.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: intel-aac-diagnostic
          path: |
            results/
            ${{ runner.temp }}/ffmpeg/configure-options.txt
            ${{ runner.temp }}/ffmpeg/build-receipt.json

name: Finder calibration on hosted macOS
on:
  workflow_dispatch:
    inputs:
      unsigned_run_id:
        description: Prior unsigned package containing the real app for calibration
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: aarch64 }
          - { os: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-unsigned-${{ matrix.arch }}
          path: ${{ runner.temp }}/unsigned
          github-token: ${{ github.token }}
          run-id: ${{ inputs.unsigned_run_id }}
      - name: Measure and capture the real Finder window
        run: |
          cd "$RUNNER_TEMP/unsigned"
          shasum -a 256 -c SHA256SUMS
          ditto -x -k ./*-unsigned.zip "$RUNNER_TEMP/input"
          cd "$GITHUB_WORKSPACE"
          python -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r src-tauri/dmg/requirements.txt
          bash review/capture.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: finder-${{ matrix.arch }}
          path: ${{ runner.temp }}/review/evidence/

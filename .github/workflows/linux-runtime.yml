name: Linux packaged playback diagnostics
on:
  workflow_call:
    inputs:
      package_run:
        type: string
        required: true
      null_sink:
        type: string
        default: ready-default
  workflow_dispatch:
    inputs:
      package_run:
        description: Linux preview package run containing the candidate and fixtures
        type: string
        required: true
      test_ubuntu_26:
        description: Check the installed GUI under Weston on Ubuntu 26.04
        type: boolean
        default: false
      reference_run:
        description: Optional Ubuntu-FFmpeg package run for synthetic decode parity
        type: string
        default: ''
      windows_package_run:
        description: Windows package or release run at current main (required with reference_run)
        type: string
        default: ''
      null_sink:
        description: PulseAudio sink control; changes device setup, not application assertions
        type: choice
        options: [default, no-rewinds, ready-default]
        default: default
permissions:
  contents: read
  actions: read
jobs:
  shared-fixtures:
    if: inputs.reference_run != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-acceptance-fixtures
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fixtures
      - name: Encode the synthetic media once for all decoders
        run: |
          (cd "$RUNNER_TEMP/fixtures" && sha256sum -c SHA256SUMS)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 tests/release/codec-parity.py encode --ffmpeg /usr/bin/ffmpeg \
            --fixtures "$RUNNER_TEMP/fixtures" --output "$RUNNER_TEMP/packets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-codec-fixtures
          path: ${{ runner.temp }}/packets
          if-no-files-found: error
          retention-days: 90
  windows-parity:
    needs: shared-fixtures
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify the Windows package built from current main
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.windows_package_run }}
        shell: bash
        run: |
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ ]]
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          built=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" --jq '. | select(.head_branch=="main" and .conclusion=="success") | .head_sha')
          test "$main" = "$built"
          echo "MAIN_COMMIT=$main" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-unsigned-x64
          run-id: ${{ inputs.windows_package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-codec-fixtures
          path: ${{ runner.temp }}/packets
      - name: Decode the verified files with the main Windows package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $r = $env:RUNNER_TEMP
          Expand-Archive "$r/windows/*_x64_windows.zip" "$r/windows"
          $receipt = Get-Content -Raw "$r/windows/VisualSubForge/native-runtime.json" | ConvertFrom-Json
          if ($receipt.commit -ne $env:MAIN_COMMIT) { throw "Windows package receipt differs from main" }
          cargo build --locked -p media-analysis --bin media-analysis --example scene-scan
          python tests/release/codec-parity.py observe --bundle "$r/windows/VisualSubForge" --packets "$r/packets" --diagnostics target/debug --output "$r/observations"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: windows-shared-codec-observations
          path: ${{ runner.temp }}/observations
          if-no-files-found: error
          retention-days: 90
  playback:
    needs: [shared-fixtures, windows-parity]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-preview-amd64
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-acceptance-fixtures
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fixtures
      - name: Verify downloaded bytes and install the actual candidate
        id: install
        env:
          PACKAGE_RUN: ${{ inputs.package_run }}
          NULL_SINK: ${{ inputs.null_sink }}
        run: |
          (cd "$RUNNER_TEMP/candidate" && sha256sum --check SHA256SUMS)
          (cd "$RUNNER_TEMP/fixtures" && sha256sum --check SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/install-context" "$RUNNER_TEMP/evidence"
          deb=("$RUNNER_TEMP"/candidate/*.deb)
          test "${#deb[@]}" -eq 1
          cp "${deb[0]}" "$RUNNER_TEMP/install-context/preview.deb"
          cp tests/release/linux-install.Dockerfile "$RUNNER_TEMP/install-context/Dockerfile"
          docker build --pull -t vsf-preview-install "$RUNNER_TEMP/install-context"
          docker build -t vsf-preview-gui -f tests/release/linux-gui.Dockerfile tests/release
          docker image inspect vsf-preview-gui > "$RUNNER_TEMP/evidence/gui-image.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          binary = root / 'install-context/preview.deb'
          context = {'package_run': os.environ['PACKAGE_RUN'], 'diagnostic_commit': os.environ['GITHUB_SHA'],
                     'deb_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                     'null_sink': os.environ['NULL_SINK'],
                     'scope': 'Ten fresh containers; unchanged production smoke assertions; virtual display/null audio'}
          (root / 'evidence/context.json').write_text(json.dumps(context, indent=2) + '\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.reference_run != ''
        with:
          name: linux-preview-amd64
          run-id: ${{ inputs.reference_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reference
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.reference_run != ''
        with:
          name: shared-codec-fixtures
          path: ${{ runner.temp }}/packets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.reference_run != ''
        with:
          name: windows-shared-codec-observations
          path: ${{ runner.temp }}/windows-observed
      - name: Compare native decoders, waveform bins, cuts and subtitles
        if: inputs.reference_run != ''
        run: |
          (cd "$RUNNER_TEMP/reference" && sha256sum -c SHA256SUMS)
          # The hosted runner is separate from the clean install containers.
          # Both extracted packages need their own declared desktop runtimes.
          sudo apt-get update
          sudo apt-get satisfy -y --no-install-recommends \
            "$(dpkg-deb -f "$RUNNER_TEMP"/reference/*.deb Depends)" \
            "$(dpkg-deb -f "$RUNNER_TEMP"/candidate/*.deb Depends)"
          dpkg-deb -x "$RUNNER_TEMP"/reference/*.deb "$RUNNER_TEMP/before"
          dpkg-deb -x "$RUNNER_TEMP"/candidate/*.deb "$RUNNER_TEMP/after"
          cargo build --locked -p media-analysis --bin media-analysis --example scene-scan
          python3 tests/release/codec-parity.py observe \
            --before "$RUNNER_TEMP/before/usr/lib/visualsubforge" --bundle "$RUNNER_TEMP/after/usr/lib/visualsubforge" \
            --fixtures "$RUNNER_TEMP/fixtures" --diagnostics target/debug --output "$RUNNER_TEMP/evidence/parity" \
            --packets "$RUNNER_TEMP/packets" --windows "$RUNNER_TEMP/windows-observed/observations.json"
      - name: Repeat unchanged playback assertions in ten fresh containers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          NULL_SINK: ${{ inputs.null_sink }}
        run: |
          failed=0
          for trial in $(seq 1 10); do
            evidence="$RUNNER_TEMP/evidence/trial-$trial"
            mkdir -m 777 "$evidence"
            if ! docker run --rm --network none \
              --env "VSF_NULL_SINK=$NULL_SINK" --env VSF_LIBRARY_AUDIT=1 \
              -v "$PWD/tests/release/linux_library_bindings.py:/linux_library_bindings.py:ro" \
              -v "$PWD/tests/release/packaged-gui.py:/check-gui.py:ro" \
              -v "$PWD/tests/release/linux-gui.sh:/gui.sh:ro" \
              -v "$RUNNER_TEMP/fixtures:/fixtures:ro" \
              -v "$evidence:/evidence" vsf-preview-gui \
              timeout --signal=TERM --kill-after=10s 180s \
              xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' dbus-run-session -- bash /gui.sh \
              > "$evidence/container.log" 2>&1; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: linux-playback-diagnostics
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
  ubuntu-26-desktop:
    if: inputs.test_ubuntu_26
    strategy:
      fail-fast: false
      matrix:
        backend: [wayland, x11]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-preview-amd64
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-acceptance-fixtures
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fixtures
      - name: Install the same deb and exercise GTK under Weston
        env:
          GDK_BACKEND: ${{ matrix.backend }}
          VSF_FIXTURES: ${{ runner.temp }}/fixtures
          VSF_EVIDENCE: ${{ runner.temp }}/evidence
          VSF_NULL_SINK: ready-default
          VSF_GUI_ENVIRONMENT: Ubuntu 26.04 headless Weston with Mesa software rendering
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          (cd "$RUNNER_TEMP/candidate" && sha256sum -c SHA256SUMS)
          (cd "$VSF_FIXTURES" && sha256sum -c SHA256SUMS)
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP"/candidate/*.deb weston xwayland pulseaudio pulseaudio-utils mesa-utils
          sudo install -d -m 1777 /tmp/.X11-unix
          mkdir -p "$VSF_EVIDENCE"
          export VSF_LIBRARY_AUDIT=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime" VSF_GUI_CHECK="$PWD/tests/release/packaged-gui.py"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- timeout 200 bash tests/release/linux-weston.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: linux-26.04-${{ matrix.backend }}-evidence
          path: ${{ runner.temp }}/evidence

name: Linux packaged playback diagnostics
on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Package run containing both Linux architectures
        type: string
        required: true
      architecture:
        description: Run both architectures for acceptance, or one for install diagnostics
        type: choice
        options: [both, amd64, arm64]
        default: both
      from_release:
        description: Test the Linux packages and media in the combined release artifact
        type: boolean
        default: false
      shared_fixture_run:
        description: Optional earlier shared-codec-fixtures artifact
        type: string
        default: ''
  workflow_call:
    inputs:
      package_run:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  shared-fixtures:
    needs: platforms
    if: inputs.shared_fixture_run == '' && (inputs.architecture == 'both' || !inputs.architecture)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-acceptance-fixtures
          run-id: ${{ needs.platforms.outputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fixtures
      - name: Encode the synthetic media once for all decoders
        run: |
          (cd "$RUNNER_TEMP/fixtures" && sha256sum -c SHA256SUMS)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 tests/release/codec-parity.py encode --ffmpeg /usr/bin/ffmpeg \
            --fixtures "$RUNNER_TEMP/fixtures" --output "$RUNNER_TEMP/packets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-codec-fixtures
          path: ${{ runner.temp }}/packets
          if-no-files-found: error
          retention-days: 90
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      package_run: ${{ inputs.from_release && github.run_id || inputs.package_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        if: inputs.from_release
        run: echo "version=$(python3 scripts/release_version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.from_release
        with:
          name: VisualSubForge-v${{ steps.version.outputs.version }}
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: downloads
      - name: Stage verified release downloads for native runners
        if: inputs.from_release
        working-directory: downloads
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum --strict -c SHA256SUMS
          for arch in amd64 arm64; do
            case "$arch" in amd64) tar_arch=x86_64 ;; arm64) tar_arch=aarch64 ;; esac
            dest="../installables/$arch"
            mkdir -p "$dest"
            for asset in "VisualSubForge_${VERSION}_${arch}.deb" "VisualSubForge_${VERSION}_${tar_arch}_linux.tar.gz"; do
              awk -v name="$asset" '$2 == name { print; n++ } END { if (n != 1) exit 1 }' SHA256SUMS >> "$dest/SHA256SUMS"
              mv "$asset" "$dest/"
            done
          done
          media="VisualSubForge-${VERSION}-test-media.zip"
          awk -v name="$media" '$2 == name { n++ } END { if (n != 1) exit 1 }' SHA256SUMS
          unzip -q "$media" -d ../fixtures
          (cd ../fixtures && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.from_release
        with:
          name: linux-installables-amd64
          path: installables/amd64
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.from_release
        with:
          name: linux-installables-arm64
          path: installables/arm64
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.from_release
        with:
          name: preview-acceptance-fixtures
          path: fixtures
          if-no-files-found: error
          compression-level: 0
      - id: images
        env:
          ARCH: ${{ inputs.architecture || 'both' }}
        shell: python
        run: |
          import json, os
          from pathlib import Path
          rows = []
          for distro, digests in json.loads(Path('tests/release/linux-images.json').read_text()).items():
              for arch, digest in digests.items():
                  if os.environ['ARCH'] not in ('both', arch):
                      continue
                  for fmt in (['tar', 'deb'] if distro.startswith(('ubuntu:', 'debian:')) else ['tar']):
                      rows.append({'image': distro + '@' + digest, 'id': distro.replace(':', '-'),
                                   'arch': arch, 'format': fmt,
                                   'runner': 'ubuntu-24.04-arm' if arch == 'arm64' else 'ubuntu-24.04',
                                   'trials': 10 if distro in ('ubuntu:24.04', 'ubuntu:26.04') else 1})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('matrix=' + json.dumps({'include': rows}), file=out)
  install:
    name: ${{ matrix.id }} ${{ matrix.arch }} ${{ matrix.format }}
    needs: platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-installables-${{ matrix.arch }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.platforms.outputs.package_run }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-acceptance-fixtures
          github-token: ${{ github.token }}
          run-id: ${{ needs.platforms.outputs.package_run }}
          path: fixtures
      - name: Verify downloads and install on the pinned distribution
        env:
          BASE_IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
        run: |
          (cd candidate && sha256sum -c SHA256SUMS)
          (cd fixtures && sha256sum -c SHA256SUMS)
          mkdir -p matrix-context/tests/release evidence
          cp -r candidate matrix-context/
          cp tests/release/linux-matrix-install.sh matrix-context/tests/release/
          docker pull "$BASE_IMAGE"
          docker image inspect "$BASE_IMAGE" > evidence/base-image.json
          docker build --build-arg BASE_IMAGE --build-arg FORMAT \
            -f tests/release/linux-matrix.Dockerfile -t vsf-matrix matrix-context
      - name: Offline CLI, native GUI, library bindings and removal
        env:
          FORMAT: ${{ matrix.format }}
          TRIALS: ${{ matrix.trials }}
          VSF_GUI_ENVIRONMENT: ${{ matrix.image }}
        run: |
          failed=0
          for n in $(seq 1 "$TRIALS"); do
            evidence="$PWD/evidence/trial-$n"
            mkdir "$evidence"
            if ! docker run --rm --network none -e VSF_GUI_ENVIRONMENT -e VSF_FULL_TRIAL="$((n == 1))" \
              -v "$PWD/fixtures:/fixtures:ro" -v "$PWD/tests/release:/tests:ro" \
              -v "$evidence:/evidence" vsf-matrix timeout --kill-after=10s 240s \
              bash /tests/linux-matrix-trial.sh "$FORMAT" > "$evidence/container.log" 2>&1; then
              tail -60 "$evidence/container.log"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: matrix-${{ matrix.id }}-${{ matrix.arch }}-${{ matrix.format }}
          path: evidence/
  observe-amd64:
    needs: [platforms, shared-fixtures]
    if: ${{ !cancelled() && (inputs.architecture == 'both' || !inputs.architecture) && needs.platforms.result == 'success' && (needs.shared-fixtures.result == 'success' || inputs.shared_fixture_run != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-codec-fixtures
          run-id: ${{ inputs.shared_fixture_run || github.run_id }}
          github-token: ${{ github.token }}
          path: packets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-installables-amd64
          run-id: ${{ needs.platforms.outputs.package_run }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Observe the installed media tools on native amd64
        run: |
          (cd candidate && sha256sum -c SHA256SUMS)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./candidate/*.deb
          cargo build --locked -p media-analysis --bin media-analysis --example scene-scan
          python3 tests/release/codec-parity.py observe --bundle /usr/lib/visualsubforge/bin --packets packets \
            --diagnostics target/debug --output observations --save-pcm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: amd64-observations
          path: observations/
  observe-arm64:
    needs: [platforms, observe-amd64]
    if: ${{ !cancelled() && needs.observe-amd64.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-codec-fixtures
          run-id: ${{ inputs.shared_fixture_run || github.run_id }}
          github-token: ${{ github.token }}
          path: packets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-installables-arm64
          run-id: ${{ needs.platforms.outputs.package_run }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: amd64-observations
          path: reference
      - name: Observe the installed media tools on native arm64
        run: |
          (cd candidate && sha256sum -c SHA256SUMS)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./candidate/*.deb
          cargo build --locked -p media-analysis --bin media-analysis --example scene-scan
          python3 tests/release/codec-parity.py observe --bundle /usr/lib/visualsubforge/bin --packets packets \
            --diagnostics target/debug --output observations --save-pcm --reference-observations reference/observations.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: arm64-observations
          path: observations/
  ubuntu-26-desktop:
    needs: platforms
    strategy:
      fail-fast: false
      matrix:
        backend: [wayland, x11]
        arch: ${{ fromJSON(inputs.architecture == 'amd64' && '["amd64"]' || inputs.architecture == 'arm64' && '["arm64"]' || '["amd64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-installables-${{ matrix.arch }}
          run-id: ${{ needs.platforms.outputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-acceptance-fixtures
          run-id: ${{ needs.platforms.outputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fixtures
      - name: Install the same deb and exercise GTK under Weston
        env:
          GDK_BACKEND: ${{ matrix.backend }}
          VSF_GUI_BIN: /usr/bin/visualsubforge
          VSF_FIXTURES: ${{ runner.temp }}/fixtures
          VSF_EVIDENCE: ${{ runner.temp }}/evidence
          VSF_NULL_SINK: ready-default
          VSF_GUI_ENVIRONMENT: Ubuntu 26.04 headless Weston with Mesa software rendering
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          (cd "$RUNNER_TEMP/candidate" && sha256sum -c SHA256SUMS)
          (cd "$VSF_FIXTURES" && sha256sum -c SHA256SUMS)
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP"/candidate/*.deb weston xwayland pulseaudio pulseaudio-utils mesa-utils
          sudo install -d -m 1777 /tmp/.X11-unix
          mkdir -p "$VSF_EVIDENCE"
          export VSF_LIBRARY_AUDIT=1
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime" VSF_GUI_CHECK="$PWD/tests/release/packaged-gui.py"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- timeout 200 bash tests/release/linux-weston.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: linux-26.04-${{ matrix.arch }}-${{ matrix.backend }}-evidence
          path: ${{ runner.temp }}/evidence

name: Native build contracts
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    paths:
      - '.github/workflows/native.yml'
      - '.github/actions/install-apt/**'
      - 'scripts/check-mpv-build.py'
      - 'scripts/prepare-mpv-clock.py'
      - 'scripts/prepare-angle-headers.py'
      - 'scripts/native_evidence.py'
      - 'scripts/source_archive.py'
      - 'tests/native/build-requirements.txt'
      - 'tests/native/mpv-render/**'
      - 'tests/native/mpv-clock/**'
      - 'tests/native/mpv-coreaudio-cleanup/**'
      - 'tests/native/angle/**'
      - 'crates/media-player/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mpv-recipe:
    name: Pinned mpv ${{ matrix.variant }} build and upstream tests (no device)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        variant: [render, baseline, candidates]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - run: brew install mpv pkg-config
      - run: |
          python -m pip install --only-binary=:all: -r tests/native/build-requirements.txt
      - run: git clone https://github.com/mpv-player/mpv.git "$RUNNER_TEMP/mpv-upstream"
      - run: python scripts/check-mpv-build.py --source "$RUNNER_TEMP/mpv-upstream" --output "$RUNNER_TEMP/native-${{ matrix.variant }}" --variant "${{ matrix.variant }}"
      # Raw Meson testlog.json includes inherited environment; do not upload it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: mpv-${{ matrix.variant }}-build-evidence
          path: |
            ${{ runner.temp }}/native-${{ matrix.variant }}/build-receipt.json
            ${{ runner.temp }}/native-${{ matrix.variant }}/commands.log
          retention-days: 14
  adapters:
    name: Native adapter compilation on ${{ matrix.os }} (no runtime claim)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Prepare pinned public mpv API headers
        shell: bash
        run: |
          git clone https://github.com/mpv-player/mpv.git "$RUNNER_TEMP/mpv-upstream"
          python scripts/prepare-mpv-clock.py --source "$RUNNER_TEMP/mpv-upstream" --output "$RUNNER_TEMP/mpv-headers" --render-only
      - name: Cache pinned ANGLE header archive
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/angle-include.tar.gz
          key: angle-headers-v1-${{ hashFiles('tests/native/angle/manifest.json') }}
      - name: Compile the macOS ANGLE adapter against pinned headers
        if: runner.os == 'macOS'
        run: |
          python scripts/prepare-angle-headers.py --cache-archive "$RUNNER_TEMP/angle-include.tar.gz" --output "$RUNNER_TEMP/angle-headers"
          clang++ -std=c++17 -fobjc-arc -DVSF_USE_ANGLE -fsyntax-only -I"$RUNNER_TEMP/angle-headers/include" -I"$RUNNER_TEMP/mpv-headers/source/include" crates/media-player/native/player.mm
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Compile the Windows adapter against pinned headers
        if: runner.os == 'Windows'
        run: cl.exe /nologo /std:c++17 /EHsc /c /I"$env:RUNNER_TEMP/mpv-headers/source/include" crates/media-player/native/player_windows.cpp /Fo"$env:RUNNER_TEMP/vsf-player.obj"
      - name: Install Linux adapter dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt
        with:
          packages: libgtk-3-dev libepoxy-dev libmpv-dev pkg-config
          cache-also: g++ patchelf
      - name: Compile the Linux adapter and Rust FFI
        if: runner.os == 'Linux'
        run: |
          pkg-config --cflags gtk+-3.0 epoxy > "$RUNNER_TEMP/gtk-cflags"
          c++ -std=c++17 -fsyntax-only @"$RUNNER_TEMP/gtk-cflags" -I"$RUNNER_TEMP/mpv-headers/source/include" crates/media-player/native/player_linux.cpp
          rustup show
          cargo check --locked -p media-player --features native-mpv

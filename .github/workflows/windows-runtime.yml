name: Windows installed candidate validation
on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Windows package run containing windows-preview-x64
        type: string
        required: true
      fixture_run:
        description: Linux package run containing preview-acceptance-fixtures
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Prepare a verified virtual audio device for hosted GUI validation
        run: ./tests/release/windows-audio.ps1 -Output "$env:RUNNER_TEMP/virtual-audio"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-preview-x64
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-acceptance-fixtures
          run-id: ${{ inputs.fixture_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fixtures
      - name: Verify actual candidate and fixture download hashes
        env:
          PACKAGE_RUN: ${{ inputs.package_run }}
          FIXTURE_RUN: ${{ inputs.fixture_run }}
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os
          root = Path(os.environ['RUNNER_TEMP'])
          context = {'package_run': os.environ['PACKAGE_RUN'], 'fixture_run': os.environ['FIXTURE_RUN'],
                     'validation_commit': os.environ['GITHUB_SHA'], 'downloads': {}}
          for folder in ('candidate', 'fixtures'):
              directory = (root / folder).resolve(strict=True)
              files = {}
              for line in (directory / 'SHA256SUMS').read_text(encoding='utf-8-sig').splitlines():
                  expected, name = line.split(None, 1)
                  path = (directory / name.lstrip('*')).resolve(strict=True)
                  if not path.is_relative_to(directory):
                      raise ValueError(f'Invalid checksum path: {name}')
                  with path.open('rb') as stream:
                      actual = hashlib.file_digest(stream, 'sha256').hexdigest()
                  if actual != expected.lower():
                      raise ValueError(f'Download checksum differs: {name}')
                  files[name] = actual
              if not files:
                  raise ValueError(f'Empty checksum manifest: {folder}')
              context['downloads'][folder] = files
          (root / 'context.json').write_text(json.dumps(context, indent=2) + '\n')
      - name: Unpack the assembled reference beside its installer
        run: |
          Expand-Archive "$env:RUNNER_TEMP/candidate/VisualSubForge_0.0.1-alpha_x64_windows.zip" "$env:RUNNER_TEMP/candidate"
          Copy-Item "$env:RUNNER_TEMP/candidate/VisualSubForge/native-runtime.json" "$env:RUNNER_TEMP/candidate/assembly-receipt.json"
      # The original unload hazard modifies libc++'s process-wide terminate
      # handler. An MSVC-linked probe would observe a different runtime.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANG64
          update: true
          install: mingw-w64-clang-x86_64-clang
      - name: Build the libc++ unload control
        shell: msys2 {0}
        run: |
          clang++ --version > "$RUNNER_TEMP/probe-compiler.txt"
          clang++ -std=c++17 -Wall -Wextra -Werror -municode tests/native/windows-dll-reload-probe.cpp -o "$RUNNER_TEMP/dll-reload-probe.exe"
      - name: Install and verify resources, offline resync and DLL teardown
        run: python tests/release/windows-install.py --package "$env:RUNNER_TEMP/candidate" --installer-dir "$env:RUNNER_TEMP/candidate" --probe "$env:RUNNER_TEMP/dll-reload-probe.exe" --fixtures "$env:RUNNER_TEMP/fixtures/resync" --output "$env:RUNNER_TEMP/install-check"
      - name: Exercise production GUI commands and ordered native shutdown
        run: python tests/release/packaged-gui.py --executable "$env:RUNNER_TEMP/install-check/Installed Preview/visualsubforge.exe" --fixture "$env:RUNNER_TEMP/fixtures/vfr-offset.mkv" --output "$env:RUNNER_TEMP/install-check/gui" --environment "Windows Server 2022 hosted runner; pinned Scream virtual WASAPI device; renderer must be read from logs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: windows-installed-candidate-evidence
          path: |
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/probe-compiler.txt
            ${{ runner.temp }}/install-check/*.json
            ${{ runner.temp }}/install-check/*.log
            ${{ runner.temp }}/install-check/offline/network-isolation.json
            ${{ runner.temp }}/install-check/offline/cli/packaged-cli-check.json
            ${{ runner.temp }}/install-check/gui/*
            ${{ runner.temp }}/virtual-audio/*.json
            ${{ runner.temp }}/virtual-audio/*.log
          if-no-files-found: error
          retention-days: 14

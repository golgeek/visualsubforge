name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  domain:
    name: Domain without desktop dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show
      - run: cargo check --locked -p subtitle-core -p subtitle-formats
      - run: cargo test --locked -p subtitle-core -p subtitle-formats
      - run: cargo clippy --locked -p subtitle-core -p subtitle-formats --all-targets -- -D warnings
  media-analysis:
    name: Synthetic media analysis (no desktop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show
      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python3 scripts/media-fixtures.py
      - run: python3 scripts/scene-fixtures.py
      - run: python3 scripts/resync-fixtures.py --extended --robustness
      - run: cargo test --locked -p media-analysis -p vsf-application
      - run: cargo test --locked -p media-analysis --example resync-evaluate
      - run: cargo test --locked -p media-analysis --test ffmpeg --test scenes --test visual -- --ignored --nocapture --test-threads=1
      - run: cargo test --locked -p vsf-application --test resync_ffmpeg -- --ignored --nocapture --test-threads=1
      - name: Evaluate synthetic resync ground truth
        run: cargo run --locked -p media-analysis --example resync-evaluate > tests/fixtures/generated/resync/evaluation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: resync-experiment-results
          path: |
            tests/fixtures/generated/resync/truth.json
            tests/fixtures/generated/resync/evaluation.json
          retention-days: 7
      - run: cargo clippy --locked -p media-analysis -p vsf-application --all-targets -- -D warnings
  headless:
    name: Headless CLI and persistence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Install pinned Rust
        run: rustup show
      - name: Install Linux FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Record tool and architecture evidence
        run: |
          rustc -vV
          python --version
          ffmpeg -version
          ffprobe -version
      - run: python scripts/resync-fixtures.py --robustness
      - run: cargo test --locked -p vsf-application -p vsf-cli
      - name: Check packaged tool resolution separately from development overrides
        run: |
          cargo test --locked -p media-analysis --features bundled-tools --lib tools::tests
          cargo clippy --locked -p vsf-cli --features bundled-tools --all-targets -- -D warnings
      - name: Verify bounded frame sampling and filter-file portability
        run: cargo test --locked -p media-analysis --test visual -- --ignored --nocapture --test-threads=1
      - name: Exercise Windows console cancellation and child cleanup
        if: runner.os == 'Windows'
        run: |
          cargo build --locked -p vsf-cli
          python tests/cli/windows-signals.py --vsf target/debug/vsf.exe
      - run: cargo test --locked -p vsf-application --test resync_ffmpeg -- --ignored --nocapture --test-threads=1
      - run: cargo test --locked -p vsf-cli --test cli -- --ignored --nocapture --test-threads=1
      - name: Evaluate resync robustness ground truth
        run: cargo run --locked -p media-analysis --example resync-evaluate > tests/fixtures/generated/resync/evaluation.json
      - run: cargo clippy --locked -p vsf-application -p vsf-cli --all-targets -- -D warnings
      - name: Inspect headless runtime dependencies
        run: cargo tree --locked -p vsf-cli --edges normal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: headless-fixture-truth-${{ matrix.os }}
          path: |
            tests/fixtures/generated/resync/truth.json
            tests/fixtures/generated/resync/evaluation.json
          retention-days: 7
  browser-workflows:
    name: Browser workflows (modeled IPC, Chromium and WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-workflow-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  native-controls:
    name: Native policy and synthetic oracle controls (no device)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: tests/native/requirements.txt
      - run: |
          python -m pip install --only-binary=:all: -r tests/native/requirements.txt
      - run: python tests/native/check-controls.py
      - run: python -m unittest discover -s tests/release -p 'test_*.py'
      - name: Install mpv headers for fake-client test
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libmpv-dev pkg-config
      - name: Compile and run shared mpv client policy controls
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -DMPV_STATIC $(pkg-config --cflags mpv) tests/native/mpv-client-test.cpp -o /tmp/vsf-mpv-client-test
          /tmp/vsf-mpv-client-test
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus
      - name: Install pinned Rust
        run: rustup show
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run ipc:check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Install Linux FFmpeg for desktop resync owner tests
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg
      - name: Install macOS FFmpeg for desktop resync owner tests
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Windows FFmpeg for desktop resync owner tests
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Exercise desktop proposal ownership with actual FFmpeg (no native player)
        run: |
          ffmpeg -version
          ffprobe -version
          python scripts/resync-fixtures.py
          cargo test --locked -p visualsubforge resync::tests::actual_analysis -- --ignored --nocapture --test-threads=1
      - run: npm run tauri -- build --debug --no-bundle -- --locked
      - name: Check optional desktop test instrumentation
        run: cargo clippy --locked -p visualsubforge --features desktop-e2e --all-targets -- -D warnings
      - run: npm run build:desktop-test
      - name: Real webview, IPC, persistence and recovery (Linux virtual display)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' dbus-run-session -- npm run test:desktop
      - name: Real webview, IPC, persistence and recovery
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: npm run test:desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-workflow-results-${{ matrix.os }}
          path: test-results/desktop-*/
          retention-days: 7
      - name: Compile macOS GPU adapter (no runtime claim)
        if: runner.os == 'macOS'
        run: |
          brew install mpv pkg-config
          pkg-config --modversion mpv
          cargo clippy --locked -p visualsubforge --features media-prototype --all-targets -- -D warnings
          npm run tauri -- build --debug --no-bundle --features media-prototype -- --locked

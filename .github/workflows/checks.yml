name: Checks
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  domain:
    name: Domain without desktop dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show
      - run: cargo check --locked -p subtitle-core -p subtitle-formats
      - run: cargo test --locked -p subtitle-core -p subtitle-formats
      - run: cargo clippy --locked -p subtitle-core -p subtitle-formats --all-targets -- -D warnings
  media-analysis:
    name: Synthetic media analysis (no desktop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust
        run: rustup show
      - name: Install fixture tools
        uses: ./.github/actions/install-apt
        with:
          packages: ffmpeg
      - run: python3 scripts/media-fixtures.py
      - run: cargo test --locked -p vsf-application --test subtitle_extraction -- --ignored
      - run: cargo test --release --locked -p vsf-application --test subtitle_extraction_edges -- --ignored --nocapture
      - run: cargo test --locked -p vsf-cli --test extraction -- --ignored
      - run: python3 scripts/scene-fixtures.py
      - run: python3 scripts/resync-fixtures.py --extended --robustness
      - run: cargo test --locked -p media-analysis -p vsf-application
      - run: cargo test --locked -p media-analysis --example resync-evaluate
      - run: cargo test --locked -p media-analysis --test ffmpeg --test scenes --test visual -- --ignored --nocapture --test-threads=1
      - run: cargo test --locked -p vsf-application --test resync_ffmpeg -- --ignored --nocapture --test-threads=1
      - name: Evaluate synthetic resync ground truth
        run: cargo run --locked -p media-analysis --example resync-evaluate > tests/fixtures/generated/resync/evaluation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: resync-experiment-results
          path: |
            tests/fixtures/generated/resync/truth.json
            tests/fixtures/generated/resync/evaluation.json
          retention-days: 7
      - run: cargo clippy --locked -p media-analysis -p vsf-application --all-targets -- -D warnings
  headless:
    name: Headless CLI and persistence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Install pinned Rust
        run: rustup show
      - name: Compile and run Rust transport policy controls (no media runtime)
        shell: bash
        run: |
          test_binary="$RUNNER_TEMP/vsf-media-transport-test"
          if [ "$RUNNER_OS" = "Windows" ]; then
            test_binary="$test_binary.exe"
          fi
          rustc --edition=2024 --test --cfg 'feature="media-prototype"' tests/native/media-transport-test.rs -o "$test_binary"
          "$test_binary"
      - name: Install Linux FFmpeg
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt
        with:
          packages: ffmpeg
      - name: Verify Windows package network isolation and restoration
        if: runner.os == 'Windows'
        run: ./tests/release/windows-offline.ps1 -ControlOnly -Output "$env:RUNNER_TEMP/network-control"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        with:
          name: windows-network-control
          path: ${{ runner.temp }}/network-control/network-isolation.json
          if-no-files-found: error
          retention-days: 14
      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        run: ./scripts/install-ci-ffmpeg.ps1
      - run: rustc -vV
      - run: python --version
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: python scripts/resync-fixtures.py --robustness
      - run: cargo test --locked -p vsf-application -p vsf-cli
      - name: Check packaged tool resolution separately from development overrides
        run: cargo test --locked -p media-analysis --features bundled-tools --lib tools::tests
      - run: cargo clippy --locked -p vsf-cli --features bundled-tools --all-targets -- -D warnings
      - name: Verify bounded frame sampling and filter-file portability
        run: cargo test --locked -p media-analysis --test visual -- --ignored --nocapture --test-threads=1
      - name: Build CLI for Windows signal tests
        if: runner.os == 'Windows'
        run: cargo build --locked -p vsf-cli
      - name: Exercise Windows console cancellation and child cleanup
        if: runner.os == 'Windows'
        run: python tests/cli/windows-signals.py --vsf target/debug/vsf.exe
      - run: cargo test --locked -p vsf-application --test resync_ffmpeg -- --ignored --nocapture --test-threads=1
      - run: cargo test --locked -p vsf-cli --test cli -- --ignored --nocapture --test-threads=1
      - name: Evaluate resync robustness ground truth
        run: cargo run --locked -p media-analysis --example resync-evaluate > tests/fixtures/generated/resync/evaluation.json
      - run: cargo clippy --locked -p vsf-application -p vsf-cli --all-targets -- -D warnings
      - name: Inspect headless runtime dependencies
        run: cargo tree --locked -p vsf-cli --edges normal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: headless-fixture-truth-${{ matrix.os }}
          path: |
            tests/fixtures/generated/resync/truth.json
            tests/fixtures/generated/resync/evaluation.json
          retention-days: 7
  browser-workflows:
    name: Browser workflows (modeled IPC, Chromium and WebKit)
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-workflow-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  native-controls:
    name: Native policy and synthetic oracle controls (no device)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: tests/native/requirements.txt
      - run: |
          python -m pip install --only-binary=:all: -r tests/native/requirements.txt
      - run: python tests/native/check-controls.py
      - name: Install native policy and package-control prerequisites
        uses: ./.github/actions/install-apt
        with:
          packages: g++ libmpv-dev pkg-config patchelf
          cache-also: libgtk-3-dev libepoxy-dev
      - run: python -m unittest discover -s tests/release -p 'test_*.py'
      - name: Compile and run shared mpv client policy controls
        run: |
          pkg-config --cflags mpv > "$RUNNER_TEMP/mpv-cflags"
          c++ -std=c++17 -Wall -Wextra -Werror -DMPV_STATIC @"$RUNNER_TEMP/mpv-cflags" tests/native/mpv-client-test.cpp -o /tmp/vsf-mpv-client-test
          /tmp/vsf-mpv-client-test
  desktop:
    # Keep source locations for CI backtraces across the debug builds.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux desktop dependencies
        id: desktop-apt
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-apt
        with:
          packages: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus python3-gi ffmpeg
      - name: Install pinned Rust
        run: rustup show
      - name: Cache compiled desktop dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A single desktop cache per platform is roughly a gigabyte.
          # Publish from main so sibling PRs can restore the same entry.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
          env-vars: ImageVersion
          key: ${{ matrix.os }}-${{ steps.desktop-apt.outputs.digest }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run ipc:check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Linux private-bus file chooser lifecycle (no desktop service)
        if: runner.os == 'Linux'
        run: /usr/bin/python3 -I tests/native/linux-dialogs/check.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Install macOS FFmpeg for desktop resync owner tests
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Windows FFmpeg for desktop resync owner tests
        if: runner.os == 'Windows'
        run: ./scripts/install-ci-ffmpeg.ps1
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: python scripts/resync-fixtures.py
      - name: Exercise desktop proposal ownership with actual FFmpeg (no native player)
        run: cargo test --locked -p visualsubforge resync::tests::actual_analysis -- --ignored --nocapture --test-threads=1
      - run: npm run tauri -- build --debug --no-bundle -- --locked
      - name: Check optional desktop test instrumentation
        run: cargo clippy --locked -p visualsubforge --features desktop-e2e --all-targets -- -D warnings
      - run: npm run build:desktop-test
      - name: Real webview, IPC, persistence and recovery (Linux virtual display)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' dbus-run-session -- npm run test:desktop
      - name: Real webview, IPC, persistence and recovery
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: npm run test:desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-workflow-results-${{ matrix.os }}
          path: test-results/desktop-*/
          retention-days: 7
      - name: Compile macOS GPU adapter (no runtime claim)
        if: runner.os == 'macOS'
        run: |
          brew install mpv pkg-config
          # mpv.pc requires libarchive, which Homebrew installs keg-only on macOS.
          archive_prefix=$(brew --prefix libarchive)
          export PKG_CONFIG_PATH="$archive_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          pkg-config --libs --cflags 'mpv >= 2.0'
          cargo clippy --locked -p visualsubforge --features media-prototype --all-targets -- -D warnings
          npm run tauri -- build --debug --no-bundle --features media-prototype -- --locked

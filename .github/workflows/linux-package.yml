name: Linux preview package
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Ubuntu 22.04 ${{ matrix.arch }} portable package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: ubuntu:22.04@sha256:b682e31336cc8e0a73ed91ab32b7a95e32591c5ff09994490a20accf9b3600f9
          - arch: arm64
            rust: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: ubuntu:22.04@sha256:2926e8e6ef0b816e19849e33ccc728c72b921a428286e6595d52fa92c5716626
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
      volumes:
        - /home/runner/.cargo/bin:/opt/runner-cargo/bin:ro
        - /home/runner/.rustup:/opt/runner-rustup
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      RUSTUP_HOME: /opt/runner-rustup
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_TARGET: ${{ matrix.rust }}
    timeout-minutes: 120
    steps:
      - name: Prepare native Jammy build and authenticated source indexes
        run: |
          set -eu
          test "$(dpkg --print-architecture)" = "$BUILD_ARCH"
          case "$BUILD_ARCH" in
            amd64) mirror=http://archive.ubuntu.com/ubuntu ;;
            arm64) mirror=http://ports.ubuntu.com/ubuntu-ports ;;
          esac
          sed -n '/^deb /s/^deb /deb-src /p' /etc/apt/sources.list > /etc/apt/sources.list.d/jammy-src.list
          echo "deb-src $mirror noble main universe" > /etc/apt/sources.list.d/noble-src.list
          apt-get update --error-on=any
          apt-get install -y --no-install-recommends ca-certificates git curl unzip zip xz-utils patch \
            build-essential cmake autoconf automake libtool pkg-config dpkg-dev patchelf nasm gettext \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            curl libepoxy-dev zlib1g-dev libbz2-dev liblzma-dev libva-dev libdrm-dev libxv-dev \
            libharfbuzz-dev libfreetype6-dev libfribidi-dev libfontconfig1-dev liblcms2-dev libvulkan-dev libxxhash-dev \
            libpulse-dev libasound2-dev libegl1-mesa-dev libgl1-mesa-dev
          echo /opt/runner-cargo/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Verify the native toolchains
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "BUILD_TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          rustup show
          rustc -vV | grep -Fx "host: $BUILD_TARGET"
          python --version
          test -f "$pythonLocation/lib/libpython3.14.so.1.0"
          echo "$pythonLocation/lib" > /etc/ld.so.conf.d/ci-python.conf
          ldconfig
          env -u LD_LIBRARY_PATH python --version
      - name: Check packaging controls
        run: python -m unittest discover -s tests/release -p 'test_*.py'
      - name: Build native SDKs, GUI and CLI through Make
        run: make app JOBS=3 PYTHON=python
      - name: Locate Make outputs for packaging and failure evidence
        if: ${{ always() && hashFiles('target/native/linux/build-paths.json') != '' }}
        run: python scripts/native-build-paths.py github target/native/linux/build-paths.json
      - name: Capture matching Rust/frontend sources and notices
        run: python scripts/application-sources.py --target "$BUILD_TARGET" --features visualsubforge/media-prototype,visualsubforge/bundled-tools,vsf-cli/bundled-tools --output "$RUNNER_TEMP/application-sources"
      - name: Assemble private runtime, notices and exact distro sources
        run: |
          python scripts/package-linux.py \
            --visualsubforge "$CARGO_TARGET_DIR/release/visualsubforge" --vsf "$CARGO_TARGET_DIR/release/vsf" \
            --build-paths target/native/linux/build-paths.json \
            --application-sources "$RUNNER_TEMP/application-sources" \
            --output "$RUNNER_TEMP/package"
      - name: Compare contents and permissions from the two actual packages
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked/"{tar,deb}
          cd "$RUNNER_TEMP/package"
          tar -xzf ./*_linux.tar.gz -C "$RUNNER_TEMP/unpacked/tar"
          dpkg-deb -x ./*.deb "$RUNNER_TEMP/unpacked/deb"
          tar_roots=("$RUNNER_TEMP/unpacked/tar/"*)
          test "${#tar_roots[@]}" -eq 1
          deb_root="$RUNNER_TEMP/unpacked/deb/usr/lib/visualsubforge"
          diff --no-dereference -qr "${tar_roots[0]}" "$deb_root"
          for kind in tar deb; do
            if [[ "$kind" == tar ]]; then root=${tar_roots[0]}; else root=$deb_root; fi
            (cd "$root" && sha256sum --strict --quiet -c FILES.sha256)
            (cd "$root" && find . -printf '%P\t%y\t%m\t%l\n' | LC_ALL=C sort) > "$RUNNER_TEMP/unpacked/$kind.tsv"
          done
          cmp "$RUNNER_TEMP/unpacked/tar.tsv" "$RUNNER_TEMP/unpacked/deb.tsv"
          python "$GITHUB_WORKSPACE/tests/release/linux-runtime-receipt.py" "${tar_roots[0]}" ./*.deb
          cp "$RUNNER_TEMP/unpacked/deb.tsv" payload-files.tsv
      # Retain exact candidate bytes even if a later runtime assertion fails.
      - name: Archive matching native dependency sources
        run: |
          mkdir "$RUNNER_TEMP/package/recipes"
          git archive HEAD Makefile build scripts/build-{ffmpeg,linux-dovi,linux-shader-stack}.sh \
            scripts/configure-ffmpeg.sh scripts/{build-placebo,check-mpv-build,prepare-mpv-clock}.py \
            scripts/{native-cache,native-build-paths,native_evidence,source_archive}.py \
            scripts/native-{env,stage}.sh scripts/linux-portable tests/native/build-requirements.txt \
            tests/native/{mpv-clock,mpv-render,mpv-coreaudio-cleanup} | tar -xf - -C "$RUNNER_TEMP/package/recipes"
          cp "$VSF_FFMPEG_BUILD/configure-options.txt" "$VSF_FFMPEG_BUILD/config.h" "$VSF_FFMPEG_BUILD/config_components.h" \
            "$RUNNER_TEMP/package/recipes/"
          tar -czf "$RUNNER_TEMP/package/native-sources.tar.gz" -C "$RUNNER_TEMP/package" recipes distro-sources shader-stack-source.tar.gz bzip2-source.tar.gz mpv-source.tar.gz libplacebo-source.tar.gz libplacebo-build.json ffmpeg-source.tar.xz dav1d-source.tar.xz libdovi-source.tar.gz
          tar -czf "$RUNNER_TEMP/package/application-sources.tar.gz" -C "$RUNNER_TEMP/application-sources" .
          cd "$RUNNER_TEMP/package"
          sha256sum ./*.deb ./*_linux.tar.gz native-sources.tar.gz application-sources.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-preview-${{ matrix.arch }}
          path: |
            ${{ env.BUILD_TEMP }}/package/*.deb
            ${{ env.BUILD_TEMP }}/package/*_linux.tar.gz
            ${{ env.BUILD_TEMP }}/package/native-sources.tar.gz
            ${{ env.BUILD_TEMP }}/package/application-sources.tar.gz
            ${{ env.BUILD_TEMP }}/package/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Stage the runtime matrix inputs
        run: |
          mkdir "$RUNNER_TEMP/installables"
          cd "$RUNNER_TEMP/package"
          cp ./*.deb ./*_linux.tar.gz "$RUNNER_TEMP/installables/"
          grep -E '(\.deb|_linux\.tar\.gz)$' SHA256SUMS > "$RUNNER_TEMP/installables/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-installables-${{ matrix.arch }}
          path: ${{ env.BUILD_TEMP }}/installables
          if-no-files-found: error
          compression-level: 0
      # Do not upload raw Meson test logs, which contain inherited environments.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: linux-package-evidence-${{ matrix.arch }}
          path: |
            target/native/linux/cache-inputs.json
            target/native/linux/build-paths.json
            ${{ env.BUILD_TEMP }}/package/assembly-receipt.json
            ${{ env.BUILD_TEMP }}/package/payload-files.tsv
            ${{ env.VSF_PLACEBO_BUILD }}/build-receipt.json
            ${{ env.VSF_PLACEBO_BUILD }}/commands.log
            ${{ env.VSF_MPV_BUILD }}/build-receipt.json
            ${{ env.VSF_MPV_BUILD }}/commands.log
          retention-days: 14
  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install fixture encoder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generate independent fixture inputs
        run: |
          python scripts/resync-fixtures.py
          python scripts/media-fixtures.py
          python scripts/playback-fixtures.py
          python scripts/package-release-fixtures.py --output "$RUNNER_TEMP/preview-fixtures"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-acceptance-fixtures
          path: ${{ runner.temp }}/preview-fixtures
          if-no-files-found: error
          retention-days: 14

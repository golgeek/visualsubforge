[workspace]
members = ["crates/subtitle-core", "crates/subtitle-formats", "crates/media-analysis", "crates/media-player", "crates/vsf-application", "crates/vsf-cli", "src-tauri"]
default-members = ["crates/subtitle-core"]
resolver = "3"

[workspace.package]
license = "GPL-3.0-or-later"
version = "0.0.1-alpha"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

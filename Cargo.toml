[workspace]
members = ["crates/subtitle-core", "crates/subtitle-formats", "crates/media-analysis", "crates/media-player", "src-tauri"]
default-members = ["crates/subtitle-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "vsf-plugin-host"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
vsf-application = { path = "../vsf-application" }
subtitle-core = { path = "../subtitle-core" }
subtitle-formats = { path = "../subtitle-formats" }

[[bin]]
name = "vsf-plugin-worker"
path = "src/main.rs"

[lints]
workspace = true
